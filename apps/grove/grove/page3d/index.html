<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grove</title>
<!-- no favicon on this page; an empty data URL stops the browser asking
     for /favicon.ico and logging a 404 on every visit -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/3d/style.css">
<!-- The import map is what lets the vendored OrbitControls keep its plain
     `import ... from 'three'` while the page never touches a CDN. -->
<script type="importmap">
{"imports": {"three": "/3d/vendor/three.module.min.js"}}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <!-- the top-left corner: the title, and on a phone the status box and
       the soul's line under it (style.css) -->
  <div class="tl">
  <div class="panel title">
    <span class="mark">☁ ☾</span> grove
    <span class="engine-mark" id="engine">loading</span>
  </div>

  <div class="panel idbox">
    <div class="idrow">
      <span id="when">…</span>
      <span id="weather">…</span>
    </div>
    <div class="poplines" id="pops"></div>
    <div class="watchline phase"
         title="one grove day lasts a few weeks of sim time">
      <span class="d" id="phaseGlyph">·</span> <span id="phase">…</span>
    </div>
  </div>

  <div class="panel souline">
    <div class="soul" id="soul"></div>
    <div class="llmstat" id="status">…</div>
  </div>
  </div>

  <div class="bl">
    <div class="panel feed">
      <ul class="chron" id="chron" aria-live="off"></ul>
      <!-- the tabs sit under whatever they switch between: three views of
           very different heights, pinned to the bottom of the window -->
      <div class="tabs" role="tablist">
        <button class="on" id="tabChron" role="tab" aria-selected="true"
                title="what has happened, newest first">events</button>
        <button id="tabCensus" role="tab" aria-selected="false"
                title="each species, counted week by week">animals</button>
        <button id="tabTune" role="tab" aria-selected="false"
                title="the steward suggests rule changes">⚖ rules</button>
      </div>
    </div>

    <div class="panel ctl">
      <div class="row">
        <button id="pauseBtn">⏸ pause</button>
        <button id="stepBtn" title="step one week (pause first)">next week</button>
        <button id="soulBtn"
                title="let the grove's AI soul make one change; only while paused">☾ wake soul</button>
        <button id="fsBtn" title="fullscreen" aria-label="fullscreen">⛶</button>
      </div>
      <div class="row askrow">
        <input id="qinput" placeholder="ask the grove a question…" maxlength="300">
        <button id="askBtn">ask</button>
      </div>
      <div class="soul" id="askout"></div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="cardhead">
      <h3 id="cardName">…</h3>
      <span><button id="followBtn">◎ follow</button>
      <button class="x" id="cardClose" aria-label="close">✕</button></span>
    </div>
    <div class="status" id="cardState"></div>
    <ul class="timeline" id="cardRows"></ul>
  </div>

  <div class="hint foot" id="hint">
    drag to orbit · wheel to zoom · right-drag to pan · click a creature or a tree ·
    space pause · s step · n soul · f full · c calm
  </div>
</div>

<div id="tip"></div>

<div id="nogl" hidden>
  <div class="panel noglbox">
    <h3>the 3D view cannot start</h3>
    <p id="noglWhy">this browser has no WebGL.</p>
    <p class="noglhint">the grove is still here, in glyphs:</p>
    <pre id="plain">…</pre>
  </div>
</div>

<!-- the router, the day clock, the light field (all three shared with the
     estate's view), the trunks, tonight's glowing rings and the HUD panels:
     classic scripts before the module,
     which is deferred, so they exist by the time the viewer runs -->
<script src="/3d/walk.js"></script>
<script src="/3d/clock.js"></script>
<script src="/3d/field.js"></script>
<script src="/3d/forest.js"></script>
<script src="/3d/glow.js"></script>
<script src="/3d/patch.js"></script>
<script src="/3d/hud.js"></script>
<script type="module" src="/3d/viewer.js"></script>
</body>
</html>
