<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highfield</title>
<!-- no favicon on this page; an empty data URL stops the browser asking
     for /favicon.ico and logging a 404 on every visit -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/3d/style.css">
<!-- The import map is what lets the vendored OrbitControls keep its plain
     `import ... from 'three'` while the page never touches a CDN. -->
<script type="importmap">
{"imports": {"three": "/3d/vendor/three.module.min.js"}}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <!-- top-left: the title, and on a phone the status box under it (the
       box sits top-right on a desktop) -->
  <div class="tl">
  <div class="panel title">
    <span class="mark">▤</span> highfield
    <span class="engine-mark" id="engine">loading</span>
  </div>

  <div class="panel idbox">
    <div class="idrow">
      <span id="when">…</span>
      <span id="weather">…</span>
    </div>
    <div class="poplines" id="pops"></div>
    <div class="watchline" id="watch"></div>
    <div class="voiceline" id="voice"></div>
    <div class="watchline phase" title="the five phases of the day turn the light">
      <span class="d" id="phaseGlyph">·</span> <span id="phase">…</span>
    </div>
  </div>
  </div>

  <div class="bl">
    <div class="panel feed">
      <ul class="chron" id="chron" aria-live="off"></ul>
      <div class="tabs" role="tablist">
        <button class="on" id="tabChron" role="tab" aria-selected="true"
                title="one line a day, newest first">days</button>
        <button id="tabCensus" role="tab" aria-selected="false"
                title="who lives here">people</button>
        <button id="tabWatch" role="tab" aria-selected="false"
                title="what the watcher has written">☾ chronicle</button>
      </div>
    </div>

    <div class="panel ctl">
      <div class="row">
        <button id="pauseBtn">⏸ pause</button>
        <button id="stepBtn" title="run one more day now">next day</button>
        <button id="fsBtn" title="full screen">⛶ full</button>
      </div>
      <div class="speedrow">
        <span class="hint">a day every</span>
        <span id="speeds"></span>
      </div>
      <div class="speedrow phases">
        <span class="hint" title="show today at a phase of the day">today</span>
        <span id="shows"></span>
      </div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="cardhead">
      <h3 id="cardName">…</h3>
      <span><button class="x" id="cardClose" aria-label="close">✕</button></span>
    </div>
    <div class="status" id="cardState"></div>
    <ul class="timeline" id="cardRows"></ul>
  </div>

  <div class="hint foot" id="hint">
    drag to orbit · wheel to zoom · right-drag to pan · click a person, block or place
  </div>
</div>

<div id="tip"></div>

<div id="nogl" hidden>
  <div class="panel noglbox">
    <h3>the 3D view cannot start</h3>
    <p id="noglWhy">this browser has no WebGL.</p>
    <p class="noglhint">the estate is still here, in glyphs:</p>
    <pre id="plain">…</pre>
  </div>
</div>

<!-- the walk router and the HUD panels, classic scripts before the module:
     modules are deferred, so `EstateWalk` and `EstateHUD` exist by the time
     the viewer runs -->
<script src="/3d/walk.js"></script>
<!-- the panels' shared write-when-changed and en-AU counts; before hud.js -->
<script src="/3d/patch.js"></script>
<script src="/3d/hud.js"></script>
<!-- who stands where on a shared tile; uses the router -->
<script src="/3d/crowd.js"></script>
<!-- the day clock and light table, pure and testable: classic script before
     the module, like the router -->
<script src="/3d/clock.js"></script>
<!-- the light field's painter, shared with the grove's view -->
<script src="/3d/field.js"></script>
<script type="module" src="/3d/viewer.js"></script>
</body>
</html>
