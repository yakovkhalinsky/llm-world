<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highfield — 3D</title>
<!-- no favicon on this page; an empty data URL stops the browser asking
     for /favicon.ico and logging a 404 on every visit -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/3d/style.css">
<!-- The import map is what lets the vendored OrbitControls keep its plain
     `import ... from 'three'` while the page never touches a CDN. -->
<script type="importmap">
{"imports": {"three": "/3d/vendor/three.module.min.js"}}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <div class="panel title">
    <span class="mark">▤</span> highfield
    <span class="engine-mark" id="engine">loading</span>
    <a class="viewlink" href="/">← plan</a>
  </div>

  <div class="panel idbox">
    <div class="idrow">
      <span id="when">…</span>
      <span id="weather">…</span>
    </div>
    <div class="poplines" id="pops"></div>
    <div class="watchline">
      <span class="d" id="phaseGlyph">·</span> <span id="phase">…</span>
      <span class="dim"> · the five phases turn the light</span>
    </div>
  </div>

  <div class="panel ctl">
    <div class="row">
      <button id="pauseBtn">⏸ pause</button>
      <button id="stepBtn">+ day</button>
    </div>
    <div class="speedrow">
      <span class="hint">a day every</span>
      <span id="speeds"></span>
    </div>
  </div>

  <div class="card" id="card">
    <div class="cardhead">
      <h3 id="cardName">…</h3>
      <span><button class="x" id="cardClose">✕</button></span>
    </div>
    <div class="status" id="cardState"></div>
    <ul class="timeline" id="cardRows"></ul>
  </div>

  <div class="hint foot" id="hint">
    drag to orbit · wheel to zoom · right-drag to pan · click a person or block
  </div>
</div>

<div id="tip"></div>

<div id="nogl" hidden>
  <div class="panel noglbox">
    <h3>the 3D view cannot start</h3>
    <p id="noglWhy">this browser has no WebGL.</p>
    <p><a href="/">the estate is still here in the 2D plan →</a></p>
  </div>
</div>

<!-- the walk router, shared with the plan page. Classic script before the
     module: modules are deferred, so `EstateWalk` exists by the time the
     viewer runs. -->
<script src="/walk.js"></script>
<!-- the day clock and light table, pure and testable: classic script before
     the module, like the router -->
<script src="/3d/clock.js"></script>
<script type="module" src="/3d/viewer.js"></script>
</body>
</html>
