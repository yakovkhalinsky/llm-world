# The Grove's unittests take about 13 minutes, so they run only when the
# Grove changes, and weekly in case something it leans on has moved.
name: grove

on:
  pull_request:
    paths: ["apps/grove/**", ".github/workflows/grove.yml"]
  push:
    branches: [main]
    paths: ["apps/grove/**", ".github/workflows/grove.yml"]
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/grove
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
