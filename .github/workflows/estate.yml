# The estate's unittests, on every PR and every push to main. Stdlib only:
# no pip install. node is on the runner, so the wrappers around
# tools/*_check.js run too. The Grove's slower suite is grove.yml.
name: estate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/estate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
